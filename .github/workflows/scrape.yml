name: Scrape

on:
  schedule:
    - cron: "17 */6 * * *"          # every 6 hours, off the round minute
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Page budget this run (0 = default 4000)"
        default: "0"
      full:
        description: "Ignore TTLs and re-crawl everything"
        type: boolean
        default: false

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scraper
        id: scrape
        run: |
          python -m scraper.cli scrape --verbose \
            --max-pages "${{ github.event.inputs.max_pages || '0' }}" \
            ${{ github.event.inputs.full == 'true' && '--full' || '' }}

      - name: Export static JSON bundle
        if: always()
        run: python -m scraper.cli export --out data/public

      - name: Commit data
        if: steps.scrape.outcome == 'success' 
        run: |
          git config user.name "scraper-bot"
          git config user.email "scraper-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: scrape $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-logs
          path: logs/
          retention-days: 14
